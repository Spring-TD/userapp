# fly.toml app configuration file for payment-ms

app = 'fuspay-payment-ms'
primary_region = 'lhr'

[build]

[http_service]
  internal_port = 3007
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
