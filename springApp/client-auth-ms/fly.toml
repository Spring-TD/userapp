# fly.toml app configuration file generated for client-auth-ms on 2025-11-24T16:16:33+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'client-auth-ms'
primary_region = 'fra'

# Bootstrap: Fly private network http://<service-auth-app>.internal:<listen-port> (same Fly org).
[env]
  NODE_ENV = 'production'
  PORT = '4001'
  SERVICE_AUTH_URL = 'http://service-auth-ms.internal:3000'
  NOTIFICATIONS_SERVICE_URL = 'https://notifications-ms.fly.dev'
  SERVICE_AUTH_HTTP_TIMEOUT_MS = '90000'

[build]

[http_service]
  internal_port = 4001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Avoid cold-start: proxy + 8s bootstrap window was timing out before this app finished starting.
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
