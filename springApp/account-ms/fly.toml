# fly.toml app configuration file generated for account-ms
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'account-ms'
primary_region = 'fra'

[env]
  PORT = '4008'

[build]

[http_service]
  internal_port = 4008
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1