# fly.toml app configuration file generated for account-ms
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'account-ms'
primary_region = 'fra'

[env]
  PORT = '4008'
  PLATFORM_BASE_DOMAIN = 'tryspring.io'
  PLATFORM_SUBDOMAIN_PREFIX = 'www'
  # Tenant middleware calls create-app-ms; auto_stop cold starts often exceed 5s
  TENANT_RESOLVER_TIMEOUT_MS = '30000'

[build]

[http_service]
  internal_port = 4008
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1