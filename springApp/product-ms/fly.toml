# fly.toml app configuration file generated for product-ms on 2025-11-25T08:47:02+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'product-ms'
primary_region = 'cdg'

[env]
  PORT = '4005'

[build]

[http_service]
  internal_port = 4005
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  interval = '20s'
  timeout = '10s'
  grace_period = '30s'
  method = 'GET'
  path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
