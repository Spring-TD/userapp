# fly.toml app configuration file for payment-ms

app = 'payment-ms'
primary_region = 'fra'

[env]
  PORT = '4007'

[build]

[http_service]
  internal_port = 4007
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
