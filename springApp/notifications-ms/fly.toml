# fly.toml app configuration file generated for notifications-ms
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'springtd-notifications-ms'
primary_region = 'lhr'

[env]
  PORT = '4009'

[build]

[http_service]
  internal_port = 4009
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
