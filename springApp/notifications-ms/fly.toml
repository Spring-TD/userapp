# fly.toml app configuration file generated for notifications-ms
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# REQUIRED SECRETS (set via `fly secrets set ... -a springtd-notifications-ms`):
#   JWT_SECRET   -- MUST equal client-auth-ms's JWT_SECRET. Used to verify storefront
#                   access tokens on the authenticated inbox endpoints
#                   (/api/v1/notifications/inbox* and /user/:recipient). If unset, the
#                   service falls back to a dev default and rejects ALL real user tokens
#                   with 401 "Invalid or expired access token" -- in-app notifications are
#                   saved but unreadable by users. (digest must match client-auth-ms)
#   MONGODB_URI  -- notification persistence
#   MAILTRAP_*   -- email delivery (see README "Email must be configured")
#   VAPID_*      -- Web Push (optional)

app = 'springtd-notifications-ms'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 3009
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

