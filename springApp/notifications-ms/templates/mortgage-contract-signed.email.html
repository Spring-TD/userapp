<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
.content { background: #fff; padding: 24px; border-radius: 6px; }
.footer { text-align: center; font-size: 12px; color: #666; margin-top: 16px; }</style>
</head>
<body>
  <div class="content">
      <p>Hi {{userName}},</p>

  </div>
  <div class="footer">
    <p>This is an automated message. Please do not reply to this email.</p>
    <p>&copy; {{year}} {{appName}}. All rights reserved.</p>
  </div>
</body>
</html>
