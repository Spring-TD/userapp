<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
    .content { background: #fff; padding: 24px; border-radius: 6px; border: 1px solid #eee; }
    .footer { text-align: center; font-size: 12px; color: #666; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="content">
    <p>Hi {{userName}},</p>
    <p>Your withdrawal of <strong>{{amount}}</strong> could not be completed.</p>
    <p><strong>Reference:</strong> {{reference}}</p>
    <p>If your wallet was debited, the amount has been reversed or will be reversed shortly.</p>
    <p>{{detail}}</p>
  </div>
  <div class="footer">
    <p>&copy; {{year}} {{appName}}. All rights reserved.</p>
  </div>
</body>
</html>
