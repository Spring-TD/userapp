# fly.toml app configuration file generated for airsign-account-ms on 2026-02-03T01:43:35+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'airsign-account-ms'
primary_region = 'lhr'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3010'

[http_service]
  internal_port = 3010
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
