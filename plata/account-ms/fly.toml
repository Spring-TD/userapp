# fly.toml app configuration file generated for account-ms
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'account-ms-plata'
primary_region = 'lhr'

[build]

[http_service]
  internal_port = 3008
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[checks]
  [checks.health]
    port = 3008
    type = "http"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
    protocol = "http"
    tls_skip_verify = false

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1