<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product created</title>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
    .container { background: #f9f9f9; padding: 24px; border-radius: 8px; }
    .content { background: #fff; padding: 24px; border-radius: 6px; }
    .footer { text-align: center; font-size: 12px; color: #666; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <p>Hello,</p>
      <p>Product <strong>{{productName}}</strong> was created successfully for <strong>{{merchantName}}</strong>.</p>
      <p>{{detail}}</p>
    </div>
    <div class="footer">
      <p>This is an automated message. Please do not reply to this email.</p>
      <p>&copy; 2024 Plata. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
